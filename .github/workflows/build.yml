name: Build RadioBox VST3
# Version 0.4.0 validates the layered artwork editor and installers.
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Windows x64
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RadioBox-UI-Windows
          path: build-windows/ui-previews/*.png
          if-no-files-found: error
      - name: Validate Windows VST3
        shell: pwsh
        run: |
          Invoke-WebRequest 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_Windows.zip' -OutFile "$env:RUNNER_TEMP/pluginval.zip"
          Expand-Archive "$env:RUNNER_TEMP/pluginval.zip" "$env:RUNNER_TEMP/pluginval"
          $validator = Get-ChildItem "$env:RUNNER_TEMP/pluginval" -Recurse -Filter pluginval.exe | Select-Object -First 1
          if (-not $validator) { throw 'pluginval executable missing' }
          & $validator.FullName --strictness-level 5 --validate 'build-windows/HaviRadio_artefacts/Release/VST3/RadioBox.vst3' | Out-Host
          if ($LASTEXITCODE -ne 0) { throw 'VST3 validation failed' }
      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'NSIS installation failed' }
      - name: Package Windows installer
        shell: pwsh
        run: ./scripts/package-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RadioBox-Windows-x64
          path: |
            dist/RadioBox-Windows-x64.zip
            dist/RadioBox-Windows-x64-Setup.exe
          if-no-files-found: error
  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Build and test Apple Silicon
        run: bash scripts/build-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RadioBox-UI-Mac
          path: build-mac/ui-previews/*.png
          if-no-files-found: error
      - name: Validate Apple Silicon VST3
        run: |
          curl -fL 'https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip' -o "$RUNNER_TEMP/pluginval.zip"
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"
          validator=$(find "$RUNNER_TEMP/pluginval" -type f -path '*/Contents/MacOS/pluginval' -print -quit)
          test -n "$validator"
          "$validator" --strictness-level 5 --validate 'build-mac/HaviRadio_artefacts/Release/VST3/RadioBox.vst3'
      - name: Package Mac installer
        run: bash scripts/package-mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RadioBox-macOS-AppleSilicon
          path: |
            dist/RadioBox-macOS-AppleSilicon.zip
            dist/RadioBox-macOS-AppleSilicon.pkg
          if-no-files-found: error
